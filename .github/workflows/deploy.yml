# Builds the HAO Explorer and publishes it on GitHub Pages.
# Runs on every push to main, every Monday (to pick up new hao2 releases),
# and on demand from the Actions tab ("Run workflow").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # no local hao.obo here, so build-data downloads the latest release from hao2
      - run: npm run build
        env:
          TW_PROJECT_TOKEN: ${{ secrets.TW_PROJECT_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
